<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calisthenics Phase 1 Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1b1b1a;--mu:#6b6a66;--bd:#e2e0d8;--ac:#d9480f;--ok:#2b8a3e;--ch:#f1efe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#eeede8;--mu:#a09e96;--bd:#33322e;--ch:#2a2926;--ac:#ff8a4c;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#eeede8;--mu:#a09e96;--bd:#33322e;--ch:#2a2926;--ac:#ff8a4c;--ok:#69db7c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 12px}
.bar{height:8px;background:var(--ch);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:12px 0}
.wk{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit}
.wk.on{background:var(--ac);color:#fff;border-color:var(--ac)}.wk.done{border-color:var(--ok)}.wk.dl{font-style:italic}
.note{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:10px 12px;margin:8px 0 14px;color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.day.full{border-color:var(--ok)}.day h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.day h3 span{color:var(--mu);font-weight:400;font-size:13px}.rest{color:var(--mu);font-size:14px;margin:6px 0 0}
.ex{border-top:1px solid var(--bd);padding:8px 0}.ex:first-of-type{margin-top:8px}
.nm{font-weight:600}.mt{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{min-width:38px;height:34px;border:1.5px solid var(--bd);background:var(--ch);color:var(--mu);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
details summary{cursor:pointer;color:var(--ac);font-size:13px}details p{margin:4px 0 0;font-size:13.5px}
.foot{margin-top:16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;color:var(--mu);font-size:13px}
.foot button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
</style></head><body><main>
<h1>Phase 1 Tracker: Weeks 1–12</h1>
<p class="sub">Tap a box to tick off each set. Tap “How to” on any exercise for instructions.</p>
<div class="bar"><i id="tot"></i></div><div class="mt" id="totl"></div>
<div class="weeks" id="weeks"></div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>
<div class="foot"><span>Progress saves on this device’s browser.</span><button id="reset">Reset all</button></div>
</main>
<script>
var EX={
pre:["10-min prehab","Wrists, shoulders, upper back, hips","Do in this order before training."],
hol:["Hollow body hold",3,"20–30 s","rest 60 s","Lie on your back. Press your lower back into the floor, lift shoulders and straight legs a few cm off the ground, arms overhead. If your lower back arches, bend your knees (tuck) or raise your legs higher."],
pu:["Push-up",3,"10–12 slow","3 s down, 1 s pause, up; rest 90 s","Hands under shoulders, body one straight line from head to heels, glutes and abs tight. Lower chest to just above the floor, elbows about 45° from your body, push back up. Stop 2–3 reps before failure."],
pike:["Pike push-up",3,"6","4 s down; rest 90 s","Hips high in an upside-down V, feet on floor, hands shoulder-width. Bend elbows to lower your head toward the floor between your hands, then press back up. This builds toward handstand push-ups."],
dip:["Dips (bars or between two chairs)",3,"6–8","3 s down; rest 90 s","Hold yourself up on straight arms, lean slightly forward, lower until upper arms are parallel to the floor, press back up. Keep shoulders away from your ears. Use bench dips with feet on floor if you have no bars."],
pl:["RKC plank",3,"30 s","squeeze hard; rest 60 s","Forearms on floor, elbows under shoulders. Squeeze glutes, quads and abs as hard as you can, pull elbows toward your toes. Short and brutal beats long and sagging."],
sp:["Scapular pull-up",3,"8","rest 60 s","Hang from the bar with straight arms. Without bending elbows, pull your shoulder blades down and together so your body rises a few cm, then relax back. Teaches shoulder control."],
pull:["Strict pull-up",4,"3–4","1 s pause at top, 3 s down; rest 2 min","Hang with straight arms, shoulder-width grip. Pull until your chin clears the bar without swinging or kicking, then lower slowly. Keep your max at 5–6, so sets of 3–4 stay clean."],
row:["Australian row",3,"10–12","1 s squeeze; rest 90 s","Lie under a low bar (or sturdy table edge). Body straight, heels on floor, pull chest to the bar, squeeze shoulder blades, lower slowly. Feet further forward = harder."],
neg:["Negative pull-up",2,"3","5 s lowering; rest 2 min","Jump or step up so your chin is over the bar, then lower yourself as slowly as possible to a full hang. Builds pull-up strength and tendon tolerance."],
spl:["Split squat (light)",2,"8 per leg","3 s down; rest 90 s","Long stance, one foot forward. Drop the back knee toward the floor, front heel stays down, push back up. Kept light because of your running load."],
db:["Dead bug",3,"8 per side","slow; rest 60 s","Lie on your back, arms up, knees bent at 90° over hips. Lower opposite arm and leg slowly toward the floor while your lower back stays pressed down. Switch sides."],
wpu:["Wide push-up",3,"8–10","2 s down; rest 90 s","Same as a push-up, hands about 1.5x shoulder width. Shifts load to the chest and shoulders."],
chin:["Chin-up (palms toward you)",3,"4–5","3 s down; rest 2 min","Underhand shoulder-width grip. Pull chin over the bar, lower fully under control. Easier on most people than pull-ups; uses more biceps."],
urow:["Underhand Australian row",3,"10","1 s squeeze; rest 90 s","Same as the Australian row but with palms facing you. Elbows stay close to your body."],
hr:["Hollow rocks",3,"8–10","rest 60 s","In a hollow hold position, rock gently back and forth like a boat without losing the hollow shape. If your back arches, go back to holds."],
gb:["Glute bridge",2,"15","1 s squeeze; rest 60 s","Lie on your back, knees bent, feet flat. Push hips up until shoulders-hips-knees are a line, squeeze glutes, lower slowly."],
hang:["Dead hang",4,"20 s","easy; rest 45 s","Hang from the bar with relaxed straight arms, shoulders pulled slightly down (not shrugged). Builds grip and shoulder tendons."],
wp:["Wall plank",3,"30 s","rest 60 s","Face down, feet on the floor against the wall behind you, walk hands in until your body is nearly vertical and straight. Prepares your wrists and shoulders for handstands."],
frog:["Frog stand (light)",3,"10–15 s","stop if wrists hurt","Squat, hands flat on floor, knees resting on the backs of your upper arms (like shelves). Lean forward until your feet lift. Stay low and close to the floor."]
};
var PRE=["Wrists: circles, palm and back-of-hand rocks (10 each)","Shoulders: band/stick dislocates, scapular push-ups (10)","Upper back: cat-cow, open-book rotations (8/side)","Hips: deep squat hold 45 s, 90/90 switches (8/side)"];
var PLAN={1:["Day A: Push + Core",["hol","pu","pike","dip","pl"]],3:["Day B: Pull + Legs",["sp","pull","row","neg","spl","db"]],5:["Day C: Mixed",["wpu","chin","urow","hr","gb","wp"]],6:["Skill + tendon day (optional, easy)",["hang","wp","frog"]]};
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ORD=[1,2,3,4,5,6,0];
var S={},wk=1;
try{S=JSON.parse(localStorage.getItem("cal-p1-v1")||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem("cal-p1-v1",JSON.stringify(S))}catch(e){}}
function dl(w){return w%6==0}
function setsFor(base,w){return dl(w)?Math.max(2,base-1):base}
function dayKeys(w,d){var k=[],p=PLAN[d];k.push("p0","p1","p2","p3");if(p)p[1].forEach(function(id,i){var n=setsFor(EX[id][1],w);for(var s=0;s<n;s++)k.push("e"+i+"s"+s)});return k}
function cnt(w,d){var ks=dayKeys(w,d),n=0;ks.forEach(function(k){if(S[w+"-"+d+"-"+k])n++});return[n,ks.length]}
function wkPct(w){var a=0,b=0;for(var d=0;d<7;d++){var c=cnt(w,d);a+=c[0];b+=c[1]}return a/b}
function tog(w,d,k){var key=w+"-"+d+"-"+k;S[key]=!S[key];if(!S[key])delete S[key];save();render()}
function chip(w,d,k,label){var on=S[w+"-"+d+"-"+k];return '<button class="chip'+(on?' on':'')+'" onclick="tog('+w+','+d+',\''+k+'\')">'+label+'</button>'}
function render(){
 var wr=document.getElementById("weeks"),h="",t=0;
 for(var w=1;w<=12;w++){var p=wkPct(w);t+=p;h+='<button class="wk'+(w==wk?' on':'')+(p>=.99?' done':'')+(dl(w)?' dl':'')+'" onclick="wk='+w+';render()">W'+w+(dl(w)?' ↓':'')+(p>=.99?' ✓':'')+'</button>'}
 wr.innerHTML=h;
 var tp=Math.round(t/12*100);document.getElementById("tot").style.width=tp+"%";document.getElementById("totl").textContent="Overall: "+tp+"% · This week: "+Math.round(wkPct(wk)*100)+"%";
 document.getElementById("note").textContent=dl(wk)?"Deload week: fewer sets, easy effort. Recover so the next block goes better. Week 12 also: test your max push-ups, pull-ups and hollow hold.":"Build week: leave 2–3 reps in reserve on every set. If an elbow or wrist hurts above 3/10, stop that exercise and drop a step easier.";
 var g="";
 ORD.forEach(function(d){
  var c=cnt(wk,d),p=PLAN[d];
  g+='<div class="day'+(c[0]==c[1]?' full':'')+'"><h3>'+DAYS[d]+(p?': '+p[0].replace(/^Day [ABC]: /,''):': Rest from lifting')+'<span>'+c[0]+'/'+c[1]+'</span></h3>';
  g+='<div class="ex"><div class="nm">'+EX.pre[0]+'</div><div class="chips">'+PRE.map(function(x,i){return chip(wk,d,"p"+i,["Wrist","Shoulder","Back","Hips"][i])}).join("")+'</div><details><summary>How to</summary><p>'+PRE.join("<br>")+'</p></details></div>';
  if(!p)g+='<p class="rest">No lifting. Easy running only. Sleep and eat well.</p>';
  else p[1].forEach(function(id,i){var e=EX[id],n=setsFor(e[1],wk),ch="";
   for(var s=0;s<n;s++)ch+=chip(wk,d,"e"+i+"s"+s,s+1);
   g+='<div class="ex"><div class="nm">'+e[0]+'</div><div class="mt">'+n+' × '+e[2]+' · '+e[3]+'</div><div class="chips">'+ch+'</div><details><summary>How to</summary><p>'+e[4]+'</p></details></div>'});
  g+='</div>'});
 document.getElementById("grid").innerHTML=g}
document.getElementById("reset").onclick=function(){if(confirm("Clear all progress?")){S={};save();render()}};
render();
</script></body></html>
